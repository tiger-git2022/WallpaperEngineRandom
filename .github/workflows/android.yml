name: Android

# SteamWallpaper（android/，浏览 Steam 上关注的壁纸的安卓 App）的编译和发布，和电脑版（release.yml）分开：
# - 推送到 main 时：取 android/CHANGELOG.md 最上面的版本（如 “## [0.1.0] - 2026-11-10”）。标了日期、
#   而且还没有 android-v版本号 标签，就编译并发布 Release「SteamWallpaper v版本号（安卓）」，附上 APK；否则只编译。
#   标成“未发布”的版本只编译，APK 作为 artifact 上传。
# - PR 和手动运行：只编译。
# 电脑版的更新程序读 releases/latest，所以安卓版的 Release 一律 make_latest: false，绝不能成为 Latest。
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        run: |
          line=$(grep -m1 -E '^## \[[0-9]+\.[0-9]+\.[0-9]+\] - ' CHANGELOG.md || true)
          ver=$(echo "$line" | sed -E 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\] - .*/\1/')
          when=$(echo "$line" | sed -E 's/^## \[[0-9.]+\] - //')
          if [ -z "$ver" ]; then echo "android/CHANGELOG.md 里没有「## [x.y.z] - 日期」"; exit 1; fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          tag="android-v$ver"
          publish=false
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            if echo "$when" | grep -q '未发布'; then
              echo "最上面的版本 $ver 标着未发布，这次只编译"
            elif [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
              echo "$tag 已经发布过，这次只编译"
            else
              echo "$tag 还没发布，这次自动发布"
              publish=true
            fi
          fi
          echo "PUBLISH=$publish" >> "$GITHUB_ENV"
          # 本版本那一节的说明，作为 Release 的正文
          awk -v v="$ver" 'index($0, "## [" v "]") == 1 { on = 1; next } /^## / { if (on) exit } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$PUBLISH" = "true" ]; then echo "缺少 ANDROID_KEYSTORE_BASE64，不能发布"; exit 1; fi
            echo "没有发布签名（PR 来自 fork？），用调试签名编译"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "WER_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "WER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PappVersion="$VERSION"

      - name: Package
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/SteamWallpaper-v$VERSION.apk"
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamWallpaper-android
          path: android/dist/*.apk

      - name: Release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.VERSION }}
          name: SteamWallpaper v${{ env.VERSION }}（安卓）
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/notes.md
          files: android/dist/*.apk
          make_latest: false
