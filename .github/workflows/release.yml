name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v(\d+)\.(\d+)\.(\d+)$') {
            $ver = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          } else {
            $ver = "0.0.0"
          }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $file = "windows/Properties/AssemblyInfo.cs"
          $text = Get-Content $file -Raw -Encoding utf8
          $text = $text -replace 'AssemblyVersion\("[^"]*"\)', "AssemblyVersion(`"$ver.0`")"
          $text += "`n[assembly: AssemblyFileVersion(`"$ver.0`")]`n[assembly: AssemblyInformationalVersion(`"$ver`")]`n"
          Set-Content $file $text -Encoding utf8

      - name: Build
        run: dotnet build windows/WERandom.csproj -c Release -o out

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem out -Recurse -Include *.pdb | Remove-Item -Force
          Copy-Item README.md, LICENSE, CHANGELOG.md out/
          Compress-Archive -Path out/* -DestinationPath "dist/WallpaperEngineRandom-v$env:VERSION-win-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperEngineRandom-win-x64
          path: dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
