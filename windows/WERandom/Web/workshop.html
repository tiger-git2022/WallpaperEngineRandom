<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>创意工坊</title>
<style>
/* Colours follow WPF-UI (Fluent) so the page looks like the app's other pages; the page itself is transparent and the
   window's Mica / Acrylic background shows through. */
:root {
  --accent: #60cdff;
  --card: rgba(255,255,255,.051); --card2: rgba(255,255,255,.03); --hover: rgba(255,255,255,.084); --press: rgba(255,255,255,.033);
  --line: rgba(255,255,255,.083); --ctl: rgba(255,255,255,.061); --ctlhover: rgba(255,255,255,.084); --ctlline: rgba(255,255,255,.093);
  --fg: #ffffff; --fg2: rgba(255,255,255,.786); --fg3: rgba(255,255,255,.545); --chip: rgba(255,255,255,.07);
  --solid: #2c2c2c; --shadow: rgba(0,0,0,.4); --thumb: rgba(0,0,0,.3);
  --new: #ff8c42; --ok: #6ccb5f; --warn: #fce100; --danger: #ff99a4;
}
:root.light {
  --card: rgba(255,255,255,.7); --card2: rgba(255,255,255,.5); --hover: rgba(0,0,0,.037); --press: rgba(0,0,0,.024);
  --line: rgba(0,0,0,.058); --ctl: rgba(255,255,255,.7); --ctlhover: rgba(249,249,249,.5); --ctlline: rgba(0,0,0,.073);
  --fg: rgba(0,0,0,.896); --fg2: rgba(0,0,0,.606); --fg3: rgba(0,0,0,.446); --chip: rgba(0,0,0,.045);
  --solid: #f9f9f9; --shadow: rgba(0,0,0,.14); --thumb: rgba(0,0,0,.08);
  --new: #d9600b; --ok: #0f7b0f; --warn: #9d5d00; --danger: #c42b1c;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent; }
body { color: var(--fg); font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif; overflow: hidden; user-select: none; }
button { font: inherit; color: var(--fg); cursor: pointer; border: 1px solid var(--ctlline); background: var(--ctl); border-radius: 4px; padding: 5px 12px; }
button:hover { background: var(--ctlhover); }
button:active { background: var(--press); color: var(--fg2); }
button.primary { background: var(--accent); border-color: transparent; color: #000; }
:root.light button.primary { color: #fff; }
button.primary:hover { filter: brightness(.94); }
button.ghost { background: transparent; border-color: transparent; }
button.ghost:hover { background: var(--hover); }
button:disabled { opacity: .45; cursor: default; }
input[type=search], select { font: inherit; color: var(--fg); background: var(--ctl); border: 1px solid var(--ctlline); border-bottom-color: var(--fg3); border-radius: 4px; padding: 5px 10px; outline: none; }
input[type=search]:focus, select:focus { border-bottom: 2px solid var(--accent); padding-bottom: 4px; background: var(--card2); }
select option { background: var(--solid); color: var(--fg); }
a { color: var(--accent); cursor: pointer; text-decoration: none; }
a:hover { text-decoration: underline; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--fg3); border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; opacity: .6; }

/* the single column is minmax(0, 1fr): nothing inside may make the page wider than the window (an "auto" column grew
   to the top bar's natural width and the right side of the page was cut off in a narrow window) */
/* the frame around the lists never scrolls (clip, unlike hidden, cannot be scrolled from script either) */
html, body, #app, #body, #center { overflow: clip; }
#app { display: grid; grid-template-rows: auto auto 1fr; grid-template-columns: minmax(0, 1fr); height: 100vh; }
#top { display: flex; align-items: center; gap: 8px; row-gap: 8px; flex-wrap: wrap; padding: 12px 18px 10px; min-width: 0; }
.tabs { display: flex; gap: 4px; }
.tab { border: 0; background: transparent; padding: 6px 12px; border-radius: 4px; color: var(--fg2); position: relative; }
.tab:hover { background: var(--hover); }
.tab.on { background: var(--hover); color: var(--fg); font-weight: 600; }
.tab.on::after { content: ""; position: absolute; left: 50%; bottom: 1px; width: 16px; height: 3px; margin-left: -8px; border-radius: 2px; background: var(--accent); }
.tab .count { min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 9px; background: var(--new); color: #fff; font-size: 11px; font-weight: 600; }
/* number / Latin pills: a line box is ascent + descent tall, but digits and capitals sit between the baseline and the
   cap height, so centring the line box leaves them off-centre (by an amount that depends on the font). text-box trims
   the box to cap height .. baseline and equal padding (1cap = this font's cap height) makes the pill 18px, so the glyphs
   themselves are centred in any font and size. text-box only works on block containers, hence inline-block. */
.tab .count, .badge.new { display: inline-block; text-align: center; line-height: 1; text-box: trim-both cap alphabetic; padding-block: calc((18px - 1cap) / 2); }
.tab .count[hidden] { display: none; }
.tab, #top button, .bar button, .bar label { white-space: nowrap; flex-shrink: 0; }
#search { flex: 1 1 auto; width: 0; min-width: 110px; max-width: 420px; margin-left: 8px; }
#sort { min-width: 130px; }
/* the account takes the rest of the row and shrinks first (names end in "…"); only when even the avatar does not fit
   does it move to a second row */
#me { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-left: auto; color: var(--fg2); white-space: nowrap; flex: 1 1 0; min-width: 90px; }
#me img { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; }
#me .acct { display: flex; align-items: center; gap: 8px; padding: 3px 8px; color: var(--fg2); min-width: 0; max-width: 100%; flex-shrink: 1; }
#me .acct > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
#me .acct > span:last-child { flex-shrink: 0; overflow: visible; }
#me .acct > .subtag { flex-shrink: 20; }   /* "订阅：…" gives way before the name */
#me .subtag { color: var(--fg3); font-size: 12px; }
/* account menu: the browse account (timeline, browsing, following) and the subscribe account (only subscribes) */
#accounts { position: fixed; top: 50px; right: 14px; width: 340px; max-width: calc(100vw - 28px); background: var(--solid); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px var(--shadow); padding: 12px 14px; z-index: 8; display: none; }
#accounts.on { display: block; }
.acc + .acc { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; }
.acc .h { font-weight: 600; }
.acc .d { color: var(--fg3); font-size: 12px; margin: 2px 0 8px; }
.acc .row { display: flex; align-items: center; gap: 9px; }
.acc .row img { width: 28px; height: 28px; border-radius: 50%; background: var(--chip); }
.acc .row .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

#body { --dwx: var(--dw, 380px); display: grid; grid-template-columns: 200px minmax(0, 1fr) var(--dwx); min-height: 0; }
#body.nofilters { grid-template-columns: 0 minmax(0, 1fr) var(--dwx); }
#filters { overflow: auto; padding: 4px 14px 20px 18px; }
#body.nofilters #filters { display: none; }
#filters h4 { margin: 14px 0 6px; font-size: 12px; color: var(--fg3); font-weight: 600; }
#filters label { display: flex; align-items: center; gap: 7px; padding: 2px 0; color: var(--fg2); cursor: pointer; }
#filters label:hover { color: var(--fg); }
#filters input { accent-color: var(--accent); margin: 0; }
#filters .reset { margin-top: 14px; width: 100%; }
#main { overflow: auto; padding: 4px 16px 30px; position: relative; }
#detail { overflow: auto; margin: 0 12px 12px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--card2); }
/* drag the left edge of the detail panel to change its width */
#split { position: absolute; top: 0; bottom: 12px; right: calc(var(--dwx) - 4px); width: 8px; cursor: col-resize; z-index: 4; }
#split::after { content: ""; position: absolute; left: 3px; top: 40%; height: 48px; width: 2px; border-radius: 1px; background: var(--fg3); opacity: 0; transition: opacity .15s; }
#split:hover::after, #split.drag::after { opacity: .8; }
#body.nodetail #split { display: none; }
body.resizing, body.resizing * { cursor: col-resize !important; user-select: none; }
.dvnav { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; color: var(--fg3); font-size: 12px; }
.dvnav .grow { flex: 1; }
.dvnav button { padding: 2px 10px; }

.bar { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; color: var(--fg2); flex-wrap: wrap; }
.bar .grow { flex: 1; }
/* segmented switch (creator page: all / not subscribed / subscribed) */
.seg { display: inline-flex; border: 1px solid var(--ctlline); border-radius: 4px; overflow: hidden; flex-shrink: 0; }
.seg button { border: 0; border-radius: 0; background: var(--ctl); padding: 4px 12px; }
.seg button + button { border-left: 1px solid var(--ctlline); }
.seg button.on { background: var(--accent); color: #000; font-weight: 600; }
:root.light .seg button.on { color: #fff; }
/* tiles always fill the row; --cols (see sizeTiles) picks how many so that a tile is never wider than it is with the
   detail panel closed: opening or widening the panel adds a column and shrinks the tiles a little, it never leaves a gap */
.grid { display: grid; grid-template-columns: var(--cols, repeat(auto-fill, minmax(168px, 1fr))); gap: 14px 12px; }
.tile { cursor: pointer; border-radius: 7px; padding: 5px; margin: -5px; }
.tile:hover { background: var(--hover); }
.tile.sel { background: var(--hover); outline: 2px solid var(--accent); }
.thumb { position: relative; aspect-ratio: 1 / 1; border-radius: 4px; overflow: hidden; background: var(--thumb); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
/* until a picture has loaded: a light sweeping across its box; then the picture fades in and the sweep stops
   (the "ok" class is set by a page-wide load listener, see start) */
@keyframes sweep { from { background-position: 150% 0; } to { background-position: -50% 0; } }
.thumb:not(.ok), .dv .big:not(.ok) { background-image: linear-gradient(100deg, transparent 35%, var(--hover) 50%, transparent 65%); background-size: 250% 100%; animation: sweep 1.3s linear infinite; }
.thumb img, .dv .big { transition: opacity .25s; }
.thumb:not(.ok) img { opacity: 0; }   /* the big detail picture is the img itself: its background shows the sweep */
.badges { position: absolute; left: 6px; top: 6px; display: flex; gap: 4px; }
.badge { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: rgba(0,0,0,.72); color: #fff; }
.badge.new { background: var(--new); padding: 0 6px; }
.badge.sub { position: absolute; right: 6px; bottom: 6px; background: rgba(16,124,16,.9); }
.badge.dl { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.72); color: var(--warn); }
/* same box as the hover button (.qu): 12px, padding 2px 9px, 1px border */
.badge.sub, .badge.dl { font-size: 12px; font-weight: 600; padding: 2px 9px; border: 1px solid transparent; }
.badge.type { position: absolute; right: 6px; top: 6px; font-weight: 600; }
.tile .t { margin-top: 6px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .s { color: var(--fg3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* timeline: a Weibo-style feed of posts; uploads in a row by one author become one post with a picture grid */
.feed { max-width: 720px; margin: 0 auto; }
/* the timeline and the author list have no side panel: everything is inside the posts */
#body.nodetail { grid-template-columns: 200px minmax(0, 1fr) 0; }
#body.nodetail.nofilters { grid-template-columns: 0 minmax(0, 1fr) 0; }
#body.nodetail #detail { display: none; }
/* the only picture of a post: whole picture in its own proportions, centred (no square crop) */
.pics.n1 { grid-template-columns: 1fr; }
.pics .tile[data-mode=big] .thumb { aspect-ratio: auto; display: flex; align-items: center; justify-content: center; min-height: 180px; border-radius: 6px; }
.pics .tile[data-mode=big] .thumb img { width: 100%; height: auto; max-height: min(440px, 60vh); object-fit: contain; }
.pics .tile[data-mode=big]:hover { background: transparent; }
.post .strip { margin-top: 8px; }
.post .chips { margin: 10px 0 4px; }
.post .meta { color: var(--fg3); font-size: 12px; }
.post .txt p.full { -webkit-line-clamp: unset; display: block; max-height: 360px; overflow: auto; user-select: text; }
.post .txt a[data-more] { font-size: 12px; }
.post .inline { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.post .inline:empty { display: none; }
.post .cm:empty { display: none; }
.post .cm { margin-top: 8px; }
.pf button.primary { padding: 4px 14px; }
.pf a[data-unsub] { color: var(--fg3); font-size: 12px; }
#lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.86); display: none; align-items: center; justify-content: center; z-index: 20; cursor: zoom-out; }
#lightbox.on { display: flex; }
#lightbox img { max-width: 96vw; max-height: 94vh; object-fit: contain; }
.post { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 8px; }
.ph { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.ph .av { width: 40px; height: 40px; border-radius: 50%; background: var(--chip); cursor: pointer; }
.ph .grow { flex: 1; min-width: 0; }
.ph .n { font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ph .n:hover { color: var(--accent); }
.ph .s { color: var(--fg3); font-size: 12px; }
.post .txt { margin: 0 0 10px; }
.post .txt b { font-size: 14px; }
.post .txt p { margin: 4px 0 0; color: var(--fg2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
.pics { display: grid; gap: 6px; grid-template-columns: minmax(0, 380px); }
.pics.multi { grid-template-columns: repeat(3, 1fr); }
.pics.multi.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.pics .tile .t { font-size: 12px; font-weight: 500; margin: 4px 2px 0; }
.pics .tile { margin: 0; padding: 0; border-radius: 6px; }
.pics .tile.sel { outline-offset: 2px; }
.pics .tile[data-mode=big] .qs { display: none; }
.pf { display: flex; align-items: center; gap: 18px; margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line); font-size: 13px; }
.pf a { color: var(--fg2); }
.pf a:hover { color: var(--accent); text-decoration: none; }
.pf a[data-sub] { color: var(--accent); font-weight: 600; }
.pf .done { color: var(--ok); }
.pf .wait { color: var(--warn); }
.feed .divider { margin: 4px 0 14px; }
.qs { position: absolute; right: 6px; bottom: 6px; padding: 2px 9px; font-size: 12px; display: none; font-weight: 600; }
.tile:hover .qs { display: block; }
/* subscribed / downloading: on hover the badge turns into "取消订阅" */
.qu { position: absolute; right: 6px; bottom: 6px; padding: 2px 9px; font-size: 12px; display: none; font-weight: 600; background: var(--solid); }
.tile:hover .qu { display: block; }
.tile:hover .qu ~ .badge.sub, .tile:hover .qu ~ .badge.dl { display: none; }
.divider { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; color: var(--fg3); font-size: 12px; margin: 6px 0; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.divider b { color: var(--fg2); font-weight: 600; }
.more { grid-column: 1 / -1; text-align: center; color: var(--fg3); padding: 18px 0; }
.empty { text-align: center; color: var(--fg3); padding: 70px 20px; line-height: 1.8; }
.empty h3 { color: var(--fg); font-size: 18px; margin: 0 0 6px; }
.empty button { margin-top: 14px; }
.warnbox { border: 1px solid var(--warn); color: var(--warn); border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; }

/* creator page: the head, the subscription filter and "已加载 N / M" sit above the scrolling list (outside it, so they
   need no background of their own and always stay visible) */
#center { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#mainhead { padding: 0 18px 10px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
#mainhead:empty { display: none; }
#mainhead .bar, #mainhead .dbar, #mainhead .devs { margin-bottom: 0; }
#mainhead .devs { margin-top: 8px; }
#center #main { flex: 1 1 auto; min-height: 0; }
.authorhead { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
.authorhead img { width: 36px; height: 36px; border-radius: 5px; background: var(--card); }
.authorhead h2 { margin: 0; font-size: 16px; line-height: 1.2; white-space: nowrap; }
.authorhead .s { color: var(--fg3); font-size: 12px; white-space: nowrap; }
.authorhead .bar { margin: 0; }
.authorhead .grow { flex: 1; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.person { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; cursor: pointer; }
.person:hover { background: var(--hover); }
.person img { width: 44px; height: 44px; border-radius: 5px; background: var(--chip); }
.person .n { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.person .s { color: var(--fg3); font-size: 12px; }

#detail .none { color: var(--fg3); text-align: center; padding: 80px 24px; }
.dv { padding: 14px; animation: dvin .22s cubic-bezier(.2, .8, .2, 1); }
@keyframes dvin { from { opacity: 0; transform: translateY(8px); } }
#detail .none.loading { display: flex; flex-direction: column; align-items: center; gap: 12px; animation: dvin .22s ease; }
#detail .none.loading .spin { width: 28px; height: 28px; border-width: 3px; }
.dv .big { width: 100%; height: 340px; object-fit: contain; background: var(--thumb); border-radius: 6px; display: block; }
.strip { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; padding-bottom: 4px; }
.strip img { height: 52px; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 4px; cursor: pointer; opacity: .75; border: 2px solid transparent; }
.strip img.on, .strip img:hover { opacity: 1; border-color: var(--accent); }
.dv h2 { font-size: 17px; margin: 12px 0 8px; user-select: text; word-break: break-word; }
.who { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
.who img { width: 32px; height: 32px; border-radius: 50%; background: var(--chip); }
.who .n { font-weight: 600; }
.who .grow { flex: 1; min-width: 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.actions .primary { flex: 1; min-width: 140px; padding: 7px 12px; }
.stats { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; color: var(--fg2); margin: 10px 0; }
.stats span:nth-child(odd) { color: var(--fg3); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0; }
.chip { background: var(--chip); border-radius: 12px; padding: 2px 9px; font-size: 12px; color: var(--fg2); cursor: pointer; }
.chip:hover { color: var(--fg); outline: 1px solid var(--accent); }
.desc { white-space: pre-wrap; color: var(--fg2); user-select: text; word-break: break-word; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 6px; max-height: 420px; overflow: auto; }
/* comments: under the detail panel, and under a timeline post after "评论" */
.cm { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 6px; }
.cm h4 { margin: 4px 0 4px; font-size: 13px; font-weight: 600; }
.cmt { display: flex; gap: 9px; padding: 7px 0; }
.cmt img { width: 32px; height: 32px; border-radius: 50%; background: var(--chip); cursor: pointer; flex-shrink: 0; }
.cmt .n { font-weight: 600; font-size: 13px; cursor: pointer; }
.cmt .n:hover { color: var(--accent); }
.cmt .w { color: var(--fg3); font-size: 12px; margin-left: 8px; }
.cmt .x { white-space: pre-wrap; word-break: break-word; color: var(--fg2); user-select: text; margin-top: 1px; }
.cm .foot { padding: 6px 0 2px; color: var(--fg3); font-size: 12px; }
#totop { position: fixed; bottom: 24px; width: 42px; height: 42px; padding: 0; border-radius: 50%; display: none; z-index: 6; background: var(--solid); box-shadow: 0 6px 18px var(--shadow); font-size: 18px; line-height: 1; }
#totop.on { display: block; }
#totop:hover { color: var(--accent); }
.status { font-size: 12px; margin-top: 4px; }
.status.ok { color: var(--ok); } .status.wait { color: var(--warn); } .status.err { color: var(--danger); }
#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--solid); border: 1px solid var(--line); border-radius: 8px; padding: 9px 16px; box-shadow: 0 8px 24px var(--shadow); display: none; z-index: 9; max-width: 70vw; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: r .8s linear infinite; vertical-align: -2px; }
@keyframes r { to { transform: rotate(360deg); } }
/* 查重: groups of wallpapers with the same content (this PC, tablet, phone) */
.dbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; color: var(--fg2); }
.dbar input[type=range] { accent-color: var(--accent); width: 150px; }
.dbar label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
.dbar .num { font-variant-numeric: tabular-nums; min-width: 34px; color: var(--fg); font-weight: 600; }
.dnote { color: var(--fg3); font-size: 12px; margin: -4px 0 12px; }
.devs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; color: var(--fg2); }
.dev { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; }
.dev.err { color: var(--danger); }
.devs input { font: inherit; color: var(--fg); background: var(--ctl); border: 1px solid var(--ctlline); border-radius: 4px; padding: 4px 8px; width: 190px; }
.sendbox { border: 1px solid var(--accent); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; }
.sendbox .h { font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.sendbox .h .grow { flex: 1; }

<script>
'use strict';
// ---------- bridge to the C# host ----------
const host = (() => {
  let seq = 0; const pending = new Map();
  window.chrome.webview.addEventListener('message', e => {
    const m = e.data;

      const p = pending.get(m.id); pending.delete(m.id);

    call(method, args) { return new Promise((res, rej) => { const id = String(++seq); pending.set(id, { res, rej }); window.chrome.webview.postMessage({ id, method, args: args || {} }); }); },

// ---------- helpers ----------
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
function toast(text, ms) { const t = $('#toast'); t.textContent = text; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', ms || 2600); }
function ago(sec) {
  if (!sec) return '';
  const d = Date.now() / 1000 - sec;
  if (d < 60) return '刚刚';
  if (d < 3600) return Math.floor(d / 60) + ' 分钟前';
  if (d < 86400) return Math.floor(d / 3600) + ' 小时前';
  if (d < 86400 * 30) return Math.floor(d / 86400) + ' 天前';
  return date(sec);
}
function date(sec) { const x = new Date(sec * 1000); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); }
function num(n) { n = +n || 0; return n >= 10000 ? (n / 10000).toFixed(n >= 100000 ? 0 : 1) + ' 万' : String(n); }
function size(b) { b = +b || 0; return b >= 1 << 30 ? (b / (1 << 30)).toFixed(1) + ' GB' : b >= 1 << 20 ? (b / (1 << 20)).toFixed(0) + ' MB' : Math.ceil(b / 1024) + ' KB'; }
// WE previews are mostly square; ask Steam's image CDN for a small copy (fits in 320×320, no letterbox)

const small = (url, px) => url ? url + (url.includes('?') ? '&' : '?') + `imw=${px || 320}&ima=fit` : '';

// ---------- tags (same groups as Wallpaper Engine) ----------
const TYPE = [['Scene', '场景'], ['Video', '视频'], ['Web', '网页'], ['Application', '应用']];
const AGE = [['Everyone', '全年龄'], ['Questionable', '轻度'], ['Mature', '成人']];
const RES = [['1920 x 1080', '1920×1080'], ['2560 x 1440', '2560×1440'], ['3840 x 2160', '3840×2160'], ['3440 x 1440', '3440×1440 带鱼屏'], ['1080 x 1920', '1080×1920 竖屏'], ['2160 x 3840', '2160×3840 竖屏'], ['Dynamic resolution', '自适应分辨率']];
const GENRE = [['Abstract', '抽象'], ['Animal', '动物'], ['Anime', '动漫'], ['Cartoon', '卡通'], ['CGI', 'CGI'], ['Cyberpunk', '赛博朋克'], ['Fantasy', '奇幻'], ['Game', '游戏'], ['Girls', '女孩'], ['Guys', '男孩'], ['Landscape', '风景'], ['Medieval', '中世纪'], ['Memes', '梗图'], ['MMD', 'MMD'], ['Music', '音乐'], ['Nature', '自然'], ['Pixel art', '像素'], ['Relaxing', '放松'], ['Retro', '复古'], ['Sci-Fi', '科幻'], ['Sports', '运动'], ['Technology', '科技'], ['Television', '影视'], ['Vehicle', '载具'], ['Unspecified', '未分类']];
const GROUPS = [['type', '类型', TYPE], ['age', '年龄分级', AGE], ['res', '分辨率', RES], ['genre', '标签', GENRE]];
const LABEL = Object.fromEntries([...TYPE, ...AGE, ...RES, ...GENRE, ['Wallpaper', '壁纸'], ['Preset', '预设'], ['Audio responsive', '音频响应'], ['Customizable', '可自定义'], ['Approved', '官方推荐']]);
const typeOf = it => (TYPE.find(t => it.tags.includes(t[0])) || [])[0] || '';
const ageOf = it => (AGE.find(t => it.tags.includes(t[0])) || [])[0] || '';
const SORTS = [
  ['trend7', '本周最热', { query_type: 3, days: 7 }], ['trend30', '本月最热', { query_type: 3, days: 30 }], ['trend365', '今年最热', { query_type: 3, days: 365 }],
  ['new', '最新发布', { query_type: 1 }], ['updated', '最近更新', { query_type: 21 }], ['subs', '订阅最多', { query_type: 9 }], ['vote', '评分最高', { query_type: 0 }], ['text', '最相关', { query_type: 12 }]
];

// ---------- persistent state (saved by the host in we_random.workshop.json) ----------
let S = { readUpTo: 0, seen: {}, pending: {}, profiles: {}, follows: [], filters: { type: [], age: [], res: [], genre: [] }, sort: 'trend7', showFilters: true, tab: 'timeline' };
let saveTimer = 0;
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(() => host.call('saveState', { state: JSON.stringify(S) }).catch(() => {}), 800); }

// ---------- runtime state ----------
let me = { loggedIn: false };
let installed = new Set();
const unsubscribed = new Set();           // unsubscribed in this session (folder may still be there)
const items = new Map();                  // id -> item
let current = null;                       // the list view on screen
let selected = null;                      // id shown in the detail panel
const views = {};                         // tab -> view
let stack = [];                           // author views opened from a tab

function norm(f) {
  return {
    id: String(f.publishedfileid), title: f.title || '(无标题)', creator: String(f.creator || ''), created: +f.time_created || 0, updated: +f.time_updated || 0,
    preview: f.preview_url || '', previews: f.previews || [], tags: (f.tags || []).map(t => t.tag), short: f.short_description || '', description: f.description || null,
    subs: +f.subscriptions || 0, fav: +f.favorited || 0, size: +f.file_size || 0, votes: f.vote_data || null, banned: !!f.banned, app: +(f.consumer_appid || f.consumer_app_id || 431960)
  };
}
function remember(f) { const n = norm(f); const old = items.get(n.id); if (old) { for (const k in n) if (n[k] != null && !(Array.isArray(n[k]) && !n[k].length && old[k] && old[k].length)) old[k] = n[k]; return old; } items.set(n.id, n); return n; }

// subscribed: in the subscribing account's subscription list on Steam (S.subs), not downloaded here
function subState(id) {
  if (unsubscribed.has(id)) return '';
  if (installed.has(id)) return 'installed';
  if (S.pending[id]) return 'pending';
  if (onSteam(id)) return 'subscribed';
  return '';
}
const onSteam = id => !!(S.subs && S.subs.owner && S.subs.owner === subscriber().steamid && S.subs.ids[id]);

// ---------- subscriptions on Steam ----------
// S.subs = { owner, ids: { id: 1 }, total, time }: the subscription list of the account that subscribes (the
// subscribe account, or the browse account without one), read from its "subscribed items" pages, 4 pages at a time.
// Read on start, when that account changes, every 30 minutes, and from the account menu.
let subsLoading = null, subsError = null;
async function loadSubs(force) {
  const owner = me.loggedIn ? subscriber().steamid : '';
  if (!owner || subsLoading) return;
  const old = S.subs;
  if (!force && old && old.owner === owner && Date.now() - old.time < 15 * 60e3) return;
  const announce = force || !old || old.owner !== owner;
  subsLoading = '正在读取订阅列表…'; subsError = null; paintSubs();

    const first = await host.call('subs', { page: 1 });

    const pages = total > 0 && first.ids.length ? Math.min(400, Math.ceil(total / first.ids.length)) : 1;
    let done = 1, failed = 0, next = 2;
    const progress = () => { subsLoading = `正在读取订阅列表：${done} / ${pages} 页，已读到 ${all.size} 个${total ? `（共 ${total} 个）` : ''}`; paintSubs(); };
    progress();
    const page = async p => { try { return await host.call('subs', { page: p }); } catch (e) { await new Promise(r => setTimeout(r, 1500)); return host.call('subs', { page: p }).catch(() => null); } };
    const worker = async () => {
      while (next <= pages) {
        const r = await page(next++);
        if (r && r.owner === owner) r.ids.forEach(id => all.add(id)); else failed++;
        done++; progress();
      }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);
    if (subscriber().steamid !== owner) return;
    const before = S.subs && S.subs.owner === owner ? S.subs.ids : {};
    S.subs = { owner, ids: Object.fromEntries([...all].map(id => [id, 1])), total, time: Date.now() };
    save();
    host.call('subsLog', { message: `读取订阅列表（${owner}）：网页上写共 ${total} 个，读到 ${all.size} 个（${pages} 页，${failed} 页失败）` }).catch(() => {});
    if (failed) subsError = `有 ${failed} 页没读到，订阅状态可能不全，可以再刷新一次`;
    if (announce || failed) toast(`订阅列表读取完成：${all.size} 个` + (failed ? `，有 ${failed} 页没读到` : ''), failed ? 6000 : 3500);
    // redraw only the wallpapers whose state changed
    for (const id of new Set([...Object.keys(before), ...all])) if (!before[id] !== !S.subs.ids[id]) refreshTile(id);
    if (current && current.kind === 'author' && (S.authorSub || 'all') !== 'all') renderList(true); else paintAuthorBar();
    if (selected && !before[selected] !== !S.subs.ids[selected]) { const it = items.get(selected), box = $('.dv .actions'); if (it && box) renderActions(box, it); }
  } catch (e) {

// full read (every 15 minutes) or when the wallpaper's details are opened.
let headBusy = false;
async function loadSubsHead() {
  const owner = me.loggedIn ? subscriber().steamid : '';
  if (!owner || subsLoading || headBusy || document.hidden || !S.subs || S.subs.owner !== owner) return;
  headBusy = true;
  try {
    const r = await host.call('subs', { page: 1 });
    if (r.owner !== owner || !S.subs || S.subs.owner !== owner) return;
    const added = r.ids.filter(id => !S.subs.ids[id]);
    if (!added.length) return;
    for (const id of added) { S.subs.ids[id] = 1; unsubscribed.delete(id); refreshTile(id); }
    if (r.total) S.subs.total = +r.total;
    save();
    host.call('subsLog', { message: `订阅列表第 1 页有 ${added.length} 个新订阅：${added.join(', ')}` }).catch(() => {});
    if (current && current.kind === 'author' && (S.authorSub || 'all') !== 'all') renderList(true); else paintAuthorBar();
    if (selected && added.includes(selected)) { const it = items.get(selected), box = $('.dv .actions'); if (it && box) renderActions(box, it); }
  } catch (e) { } finally { headBusy = false; }
}
// opening a wallpaper's details: check its page once (the list can be out of date, or miss what the account can't see)
async function checkSubscribed(id) {
  const owner = me.loggedIn ? subscriber().steamid : '';
  if (!owner) return;
  try {
    const r = await host.call('subCheck', { id });
    if (r.on == null || r.owner !== owner || subscriber().steamid !== owner) return;
    const before = subState(id);
    if (r.on) unsubscribed.delete(id); else { unsubscribed.add(id); delete S.pending[id]; }
    if (S.subs && S.subs.owner === owner && !S.subs.ids[id] !== !r.on) { if (r.on) S.subs.ids[id] = 1; else delete S.subs.ids[id]; save(); }
    if (subState(id) !== before) {
      host.call('subsLog', { message: `壁纸 ${id} 的订阅状态按网页改为${r.on ? '已订阅' : '没订阅'}` }).catch(() => {});
      refreshTile(id);
      paintAuthorBar();
      if (selected === id) { const it = items.get(id), box = $('.dv .actions'); if (it && box) renderActions(box, it); }
    }
  } catch (e) { }
}

// ---------- filters ----------
function renderFilters() {
  const f = $('#filters'); f.innerHTML = '';
  for (const [key, title, list] of GROUPS) {
    f.appendChild(h(`<h4>${title}</h4>`));
    for (const [tag, label] of list) {
      const el = h(`<label><input type="checkbox"> ${esc(label)}</label>`);
      const box = el.querySelector('input'); box.checked = S.filters[key].includes(tag);

    }
  }
  const r = h('<button class="reset">清除筛选</button>'); r.onclick = () => { S.filters = { type: [], age: [], res: [], genre: [] }; save(); renderFilters(); filtersChanged(); }; f.appendChild(r);
}
function tagGroups() {
  const groups = [];
  for (const [key, , list] of GROUPS) { const sel = S.filters[key]; if (sel.length && sel.length < list.length) groups.push({ tags: sel.slice() }); }
  return groups;
}
function passesFilters(it) {
  for (const [key, , list] of GROUPS) { const sel = S.filters[key]; if (sel.length && sel.length < list.length && !sel.some(t => it.tags.includes(t))) return false; }
  return true;
}
let filterTimer = 0;
function filtersChanged() { clearTimeout(filterTimer); filterTimer = setTimeout(() => { for (const k of ['timeline', 'browse']) views[k] = null; if (current && current.kind === 'author') renderList(); else openTab(S.tab); }, 350); }

// ---------- top bar ----------
function renderSort() {
  const s = $('#sort'); s.innerHTML = SORTS.map(x => `<option value="${x[0]}">${x[1]}</option>`).join('');
  s.value = S.sort; s.onchange = () => { S.sort = s.value; save(); views.browse = null; openTab('browse'); };
}
function renderTabs() {
  for (const b of document.querySelectorAll('.tab')) b.classList.toggle('on', b.dataset.tab === S.tab && !(current && current.kind === 'author'));
  $('#sort').style.visibility = S.tab === 'browse' ? 'visible' : 'hidden';
}
// two Steam accounts: me = the browse account (timeline, browsing, creator pages, following);
// me.sub = the subscribe account (only subscribes, e.g. the account the Steam client uses). Without it, the browse account subscribes.
const subscriber = () => (me.sub && me.sub.loggedIn) ? me.sub : me;
const twoAccounts = () => !!(me.loggedIn && me.sub && me.sub.loggedIn && me.sub.steamid !== me.steamid);
function renderMe() {
  const el = $('#me'); el.innerHTML = '';
  if (!me.loggedIn) { const b = h('<button class="primary">登录 Steam</button>'); b.onclick = login; el.appendChild(b); }
  else {
    const b = h(`<button class="ghost acct" title="浏览账号和订阅账号"><img src="${esc(me.avatar)}" alt=""><span>${esc(me.name || me.steamid)}</span>${twoAccounts() ? `<span class="subtag">订阅：${esc(me.sub.name || me.sub.steamid)}</span>` : ''}<span class="subtag">▾</span></button>`);

}
function toggleAccounts(on) {
  const box = $('#accounts'); on = on == null ? !box.classList.contains('on') : on;
  box.classList.toggle('on', on); if (on) renderAccounts();
}
function renderAccounts() {

  box.innerHTML = `<div class="acc"><div class="h">浏览账号</div><div class="d">时间线、浏览、作者页、关注都用这个号。这个号看不到部分内容时，可以换一个没被屏蔽的号登录这里。</div>
      ${me.loggedIn ? row(me, 'logout') : '<button class="primary" data-a="login">登录浏览账号</button>'}</div>
    <div class="acc"><div class="h">订阅账号</div><div class="d">只负责订阅。请登录 <b>Steam 客户端里用的号</b>，订阅后由客户端下载；没登录时订阅用浏览账号。壁纸上的「已订阅」看的是本机 Steam 客户端的下载情况。</div>

      list.filter(f => +f.result === 1).sort((a, b) => order.get(String(a.publishedfileid)) - order.get(String(b.publishedfileid))).forEach(f => { const it = remember(f); if (!v.ids.includes(it.id)) v.ids.push(it.id); });

function ensureProfiles(ids) {
  const week = Date.now() - 7 * 86400e3;

  if (!profileQueue.size) return;

// ---------- detail panel ----------
// the detail panel is there while a wallpaper is selected; clicking the selected one again (or ×) closes it
// Opening / closing the panel (or dragging its edge) changes the list's width and the tiles flow into a different
// number of columns; keepPlace keeps the wallpaper you clicked at the same height on screen while that happens.
function keepPlace(id, change) {
  const main = $('#main');
  const el = id && main.querySelector(`.tile[data-id="${id}"], .dt[data-id="${id}"]`);
  const before = el ? el.getBoundingClientRect().top : 0;

}
// FLIP: remember where the visible tiles are, make the change, then animate each from where it was to where it is now
function glide(change) {
  const main = $('#main'), m = main.getBoundingClientRect();
  const els = [...main.querySelectorAll('.grid > .tile, .dgrid > .dt, .feed > .post')].filter(e => { const r = e.getBoundingClientRect(); return r.bottom > m.top - 300 && r.top < m.bottom + 300; });
  const before = new Map(els.map(e => [e, e.getBoundingClientRect()]));
  change();
  for (const [e, a] of before) {
    const b = e.getBoundingClientRect(); if (!b.width) continue;
    const dx = a.left - b.left, dy = a.top - b.top, sc = e.classList.contains('post') ? 1 : a.width / b.width;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1 && Math.abs(sc - 1) < 0.01) continue;
    e.animate([{ transformOrigin: '0 0', transform: `translate(${dx}px, ${dy}px) scale(${sc})` }, { transformOrigin: '0 0', transform: 'none' }], { duration: 280, easing: 'cubic-bezier(.2, .8, .2, 1)' });
  }

function syncDetail(anchor) {

  if (opening) $('#detail').animate([{ opacity: 0, transform: 'translateX(24px)' }, { opacity: 1, transform: 'none' }], { duration: 240, easing: 'cubic-bezier(.2, .8, .2, 1)' });

function closeDetail() {

  const d = $('#detail');
  if ($('#body').classList.contains('nodetail') || !d.animate) { syncDetail(was); return; }
  // fade the panel out first, then let the tiles spread out
  d.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateX(24px)' }], { duration: 160, easing: 'ease-in' }).onfinish = () => { if (!selected) syncDetail(was); };

// gaps 12px); now use as few columns as keep the tiles at or below that width
function sizeTiles() {
  const body = $('#body'), cols = getComputedStyle(body).gridTemplateColumns.split(' ').map(parseFloat);
  const full = cols.reduce((a, b) => a + b, 0) - (cols.length === 3 ? cols[0] : 0) - 32;
  const now = $('#main').clientWidth - 32;
  if (!(full > 0 && now > 0)) return;   // page not shown yet; called again on resize / when shown
  const nFull = Math.max(1, Math.floor((full + 12) / (168 + 12)));
  const widest = (full - 12 * (nFull - 1)) / nFull;
  const n = Math.max(1, Math.ceil((now + 12) / (widest + 12) - 0.01));
  body.style.setProperty('--cols', `repeat(${n}, minmax(0, 1fr))`);

// The host turns every cover (a few frames of a GIF) into a vector with an image model (DINOv2) and returns the

function dcfg() { return S.dupe = Object.assign({ min: 0.75, addrs: [], ignore: [], send: {}, onlyDevice: false }, S.dupe || {}); }

function dupeAlive(it) {
  if (dupe.removed.has(it.id)) return false;
  return it.remote ? onDevices(it.id).length > 0 || !dupe.devices : installed.has(it.id) || onDevices(it.id).length > 0;

function buildGroups() {
  const d = dupe.data; if (!d) return [];
  const c = dcfg(), ign = new Set(c.ignore), min = Math.round(c.min * 1000);
  const parent = d.items.map((_, i) => i);
  const find = i => { while (parent[i] !== i) i = parent[i] = parent[parent[i]]; return i; };
  const ok = (a, b) => dupeAlive(d.items[a]) && dupeAlive(d.items[b]) && !ign.has(pairKey(d.items[a].id, d.items[b].id));
  for (const [a, b, s] of d.pairs) { if (s < min) break; if (ok(a, b)) { const ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; } }
  const map = new Map(), score = new Map();
  for (const [a, b, s] of d.pairs) {
    if (s < min) break; if (!ok(a, b)) continue;
    const r = find(a); if (!map.has(r)) map.set(r, new Set());
    map.get(r).add(a).add(b); score.set(r, Math.max(score.get(r) || 0, s));
  }
  let groups = [...map.entries()].map(([r, set]) => Object.assign([...set].map(i => d.items[i]), { score: score.get(r) }));
  if (c.onlyDevice) groups = groups.filter(g => g.some(it => onDevices(it.id).length));
  // groups touching a device first, then the closest matches
  groups.sort((x, y) => (+y.some(it => onDevices(it.id).length) - +x.some(it => onDevices(it.id).length)) || y.score - x.score);
  for (const g of groups) g.sort((x, y) => (+!!x.remote - +!!y.remote) || (y.added || 0) - (x.added || 0));
  return groups;
}

  }
  const r = $('#dmin');
  r.oninput = () => { $('#dminv').textContent = Math.round(r.value * 100) + '%'; };
  r.onchange = () => { c.min = +r.value; save(); dupe.shown = 20; renderDupes(); };
  $('#donly').onchange = e => { c.onlyDevice = e.target.checked; save(); dupe.shown = 20; renderDupes(); };
  $('#daddr').onchange = e => { c.addrs = e.target.value.split(/[,，\s]+/).map(x => x.trim()).filter(Boolean); save(); };
  if (keepScroll) main.scrollTop = top;
}
function groupDupeHtml(g, gi) {
  return `<div class="dg" data-g="${gi}"><div class="gh"><span>${g.length} 个相似，最像的两个 ${Math.round(g.score / 10)}%，不要的点「取消这个」</span><span class="grow"></span><a data-dnot="${gi}" title="这一组以后不再提示">这组不是重复</a></div>
    <div class="dgrid">${g.map(it => dupeTileHtml(it, gi, g)).join('')}</div></div>`;
}
function dupeTileHtml(it, gi, g) {
  const s = items.get(it.id) || {}, p = S.profiles[s.creator] || {};
  const devs = onDevices(it.id);
  const where = [installed.has(it.id) ? '<span class="pc">电脑</span>' : '', ...devs.map(d => `<span class="dv">${esc(d.model)}</span>`),
    !installed.has(it.id) && onSteam(it.id) ? '<span>Steam 上已订阅</span>' : '', it.remote && !onSteam(it.id) ? '<span class="gone">电脑上没有了</span>' : ''].join('');
  const info = [it.type ? (LABEL[it.type[0].toUpperCase() + it.type.slice(1).toLowerCase()] || it.type) : '', it.bytes ? size(it.bytes) : '', it.added ? '下载于 ' + date(it.added) : ''].filter(Boolean).join(' · ');
  const by = s.creator ? `<a data-works="${s.creator}" data-author="${s.creator}">${esc(p.n || '作者')}</a>${s.created ? ' · 发布于 ' + date(s.created) : ''}` : (s.created ? '发布于 ' + date(s.created) : '');
  const here = installed.has(it.id), on = dupe.applied === it.id;
  return `<div class="dt${on ? ' applied' : ''}" data-id="${it.id}"><div class="thumb"><img loading="lazy" src="${esc(it.img)}" alt="" data-dzoom></div>
    <div class="t" title="${esc(dupeTitle(it))}">${esc(dupeTitle(it))}</div>
    <div class="s">${by || '&nbsp;'}</div><div class="s">${info || '&nbsp;'}</div>
    <div class="where">${where}</div>
    <div class="acts"><button data-dapply="${it.id}" class="${on ? 'on' : ''}"${here ? ' title="放到电脑桌面上看效果，再点同组的另一个来对比"' : ' disabled title="这台电脑上没有，没法应用"'}>${on ? '✓ 桌面上' : '应用'}</button><button class="mark" data-dcancel="${gi}|${it.id}" title="取消订阅这个，从平板 / 手机挪走；这组其余的保留">取消这个</button></div>
    <div class="links"><a data-ddetail="${it.id}">详情</a><a data-dout="${gi}|${it.id}" title="它和这组的其他壁纸不是同一个">移出这组</a></div></div>`;
}
function ask(html, okText) {
  return new Promise(res => {
    const box = $('#ask'); box.querySelector('.box').innerHTML = html + `<div class="btns"><button data-no>取消</button><button class="primary" data-yes>${esc(okText || '确定')}</button></div>`;
    box.classList.add('on');
    box.onclick = e => { const y = e.target.closest('[data-yes]'), n = e.target.closest('[data-no]'); if (y || n || e.target === box) { box.classList.remove('on'); res(!!y); } };
  });
}
// "取消这个": cancel that wallpaper right away (no confirmation), keep the rest of its group
async function cancelDupes(gi, cancelId) {
  const g = dupe.groups[gi]; if (!g) return;
  const others = g.filter(x => x.id === cancelId), kept = g.filter(x => x.id !== cancelId), c = dcfg();
  if (!others.length || !kept.length) return;
  const unsub = others.filter(x => subState(x.id) || onSteam(x.id));
  const trash = (dupe.devices || []).map(d => ({ d, ids: others.filter(x => d.ids.includes(x.id)).map(x => x.id) })).filter(x => x.ids.length);
  // a device losing its copy gets one of the kept ones (the first, i.e. the newest download) unless it has one already
  const keep = kept[0], keepId = keep.id;
  const send = trash.filter(x => !kept.some(k => x.d.ids.includes(k.id))).map(x => x.d);
  const name = it => '「' + esc(dupeTitle(it)) + '」';
  const lines = [
    ...unsub.map(x => `<li>取消订阅 ${name(x)}${twoAccounts() ? '（订阅账号）' : ''}，Steam 客户端会删掉它</li>`),
    ...trash.map(x => `<li>从 ${esc(x.d.model)} 挪走 ${x.ids.map(id => name(others.find(o => o.id === id))).join('、')}（挪到 wer_trash 文件夹，可以挪回来）</li>`),
    ...send.map(d => `<li>把 ${name(keep)} 加到「要发到 ${esc(d.model)}」的列表，你再用 Wallpaper Engine 发过去</li>`)
  ];
  if (!lines.length) { for (const x of others) dupe.removed.add(x.id); renderDupes(true); toast('它已经不在电脑和设备上了'); return; }
  let failed = 0;
  for (const x of unsub) if (!await doSubscribe(items.get(x.id) || { id: x.id, title: dupeTitle(x) }, false)) failed++;
  for (const t of trash) {
    try {
      const moved = await host.call('deviceTrash', { serial: t.d.serial, library: t.d.library, ids: t.ids });
      t.d.ids = t.d.ids.filter(id => !moved.includes(id)); failed += t.ids.length - moved.length;
    } catch (e) { failed += t.ids.length; toast('从 ' + t.d.model + ' 挪走失败：' + errText(e), 6000); }
  }
  for (const d of send) { const l = c.send[d.model] || (c.send[d.model] = []); if (!l.includes(keepId)) l.push(keepId); }
  for (const x of others) { if (!onDevices(x.id).length && !(installed.has(x.id) && !unsubscribed.has(x.id))) dupe.removed.add(x.id); }
  save(); renderDupes(true);
  const did = [unsub.length ? '取消订阅' : '', trash.length ? '从' + trash.map(x => x.d.model).join('、') + '挪走' : '', send.length ? '把「' + dupeTitle(keep) + '」加到要发到设备的列表' : ''].filter(Boolean).join('，');
  toast(failed ? `有 ${failed} 项没做成，详见上面的提示` : `已取消「${dupeTitle(others[0])}」：${did}`, 6000);
}
document.addEventListener('click', async e => {
  if (S.tab !== 'dupes' || current) return;
  const t = e.target;
  if (t.closest('[data-dscan]')) { scanDupes(); return; }
  if (t.closest('[data-ddev]')) { const b = t.closest('[data-ddev]'); b.disabled = true; b.innerHTML = '<span class="spin"></span>'; await loadDevices(); renderDupes(true); return; }
  if (t.closest('[data-dmore]')) { dupe.shown += 20; renderDupes(true); return; }
  const z = t.closest('[data-dzoom]'); if (z) { lightbox(z.src); return; }
  const ap = t.closest('[data-dapply]');
  if (ap) {
    const id = ap.dataset.dapply; ap.disabled = true; ap.innerHTML = '<span class="spin"></span>';
    try { await host.call('dupeApply', { id }); dupe.applied = id; const it = dupe.data.items.find(x => x.id === id); toast('已应用到桌面：' + (it ? dupeTitle(it) : id) + '。到了换壁纸的时间会照常换走'); }
    catch (err) { toast('应用失败：' + errText(err), 6000); }
    renderDupes(true); return;
  }
  const cx = t.closest('[data-dcancel]'); if (cx) { const [gi, id] = cx.dataset.dcancel.split('|'); cx.disabled = true; cx.innerHTML = '<span class="spin"></span>'; cancelDupes(+gi, id); return; }
  const det = t.closest('[data-ddetail]'); if (det) { select(det.dataset.ddetail); return; }
  const out = t.closest('[data-dout]');
  if (out) { const [gi, id] = out.dataset.dout.split('|'); const g = dupe.groups[+gi]; const c = dcfg(); for (const x of g) if (x.id !== id) c.ignore.push(pairKey(id, x.id)); save(); renderDupes(true); return; }
  const not = t.closest('[data-dnot]');
  if (not) { const g = dupe.groups[+not.dataset.dnot]; const c = dcfg(); for (const a of g) for (const b of g) if (a.id < b.id) c.ignore.push(pairKey(a.id, b.id)); save(); renderDupes(true); return; }
  const sent = t.closest('[data-dsent]'); if (sent) { delete dcfg().send[sent.dataset.dsent]; save(); renderDupes(true); return; }
  const un = t.closest('[data-dunsend]'); if (un) { const [model, id] = un.dataset.dunsend.split('|'); const c = dcfg(); c.send[model] = (c.send[model] || []).filter(x => x !== id); if (!c.send[model].length) delete c.send[model]; save(); renderDupes(true); return; }
  const cp = t.closest('[data-dcopy]');
  if (cp) { const ids = dcfg().send[cp.dataset.dcopy] || []; const text = ids.map(id => (items.get(id) || {}).title || id).join('\n'); try { await navigator.clipboard.writeText(text); toast('已复制 ' + ids.length + ' 个标题'); } catch (err) { toast('复制失败'); } return; }
  const w = t.closest('.dt [data-works]'); if (w) { openAuthor(w.dataset.works); }
});

// ---------- installed / pending ----------
async function refreshInstalled() {
  try {
    installed = new Set(await host.call('installed'));
    let changed = false;
    for (const id of Object.keys(S.pending)) if (installed.has(id) || Date.now() - S.pending[id] > 7 * 86400e3) { delete S.pending[id]; changed = true; if (installed.has(id)) refreshTile(id); }
    if (changed) { save(); if (selected) { const it = items.get(selected); const box = $('.dv .actions'); if (it && box) renderActions(box, it); } }
  } catch (e) { }
}

// ---------- events from the host ----------
async function onHostEvent(m) {
  if (m.event === 'theme') applyTheme(m.theme, m.accent);
  else if (m.event === 'auth') { me = await host.call('status'); renderMe(); loadSubs(); }
  else if (m.event === 'showItem') select(m.id, true);
  else if (m.event === 'dupeProgress') { dupe.text = m.text; paintDupeStatus(); }
}
function applyTheme(theme, accent) {
  document.documentElement.classList.toggle('light', theme === 'light');
  if (accent) document.documentElement.style.setProperty('--accent', accent);
}

// ---------- start ----------
(async function start() {
  const q = new URLSearchParams(location.search); applyTheme(q.get('theme'), q.get('accent'));
  try { const st = await host.call('loadState'); if (st) S = Object.assign(S, JSON.parse(st)); } catch (e) { }
  S.filters = Object.assign({ type: [], age: [], res: [], genre: [] }, S.filters || {});
  for (const b of document.querySelectorAll('.tab')) b.onclick = () => tabClick(b.dataset.tab);
  $('#totop').onclick = goTop;
  // pictures: mark the box loaded (stops the sweep, fades the picture in); a broken picture stops the sweep too
  const loaded = e => { const t = e.target; if (t.tagName !== 'IMG') return; const box = t.classList.contains('big') ? t : t.closest('.thumb'); if (box) box.classList.add('ok'); };
  document.addEventListener('load', loaded, true);
  document.addEventListener('error', loaded, true);
  if (S.detailW) $('#body').style.setProperty('--dw', S.detailW + 'px');
  const split = $('#split');
  split.onpointerdown = e => {
    e.preventDefault(); split.setPointerCapture(e.pointerId); split.classList.add('drag'); document.body.classList.add('resizing');
    const body = $('#body'), box = body.getBoundingClientRect();
    split.onpointermove = m => {
      const w = Math.round(Math.max(260, Math.min(box.right - m.clientX, box.width - 300)));
      keepPlace(selected, () => { body.style.setProperty('--dw', w + 'px'); sizeTiles(); }); S.detailW = w; updateTop();
    };
    split.onpointerup = () => { split.onpointermove = split.onpointerup = null; split.classList.remove('drag'); document.body.classList.remove('resizing'); save(); };
  };
  split.ondblclick = () => { delete S.detailW; $('#body').style.removeProperty('--dw'); save(); };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { sizeTiles(); loadSubsHead(); refreshInstalled(); } });
  window.addEventListener('focus', () => loadSubsHead());
  document.addEventListener('keydown', e => {
    if (!selected || e.altKey || e.ctrlKey || e.metaKey || (e.target instanceof Element && e.target.closest('input, select, textarea')) || $('#lightbox').classList.contains('on')) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); step(e.key === 'ArrowRight' ? 1 : -1); }
  });
  $('#main').addEventListener('scroll', () => { updateTop(); clearTimeout(posTimer); posTimer = setTimeout(savePosition, 500); }, { passive: true });
  window.addEventListener('resize', () => { updateTop(); sizeTiles(); });
  document.addEventListener('click', e => {
    const subf = e.target.closest('[data-subf]'); if (subf) { S.authorSub = subf.dataset.subf; save(); renderList(); return; }
    const more = e.target.closest('[data-cmore]'); if (more) { loadComments(more.dataset.cmore, true); return; }
    const who = e.target.closest('[data-cauthor]'); if (who) { openAuthor(who.dataset.cauthor); return; }
    const cmt = e.target.closest('[data-cmt]'); if (cmt) toggleComments(cmt);
  });
  const lb = $('#lightbox'), closeLb = () => { lb.classList.remove('on'); lb.querySelector('img').src = ''; };
  lb.onclick = closeLb; document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
  $('#search').onkeydown = e => { if (e.key === 'Enter') { const t = $('#search').value.trim(); if (t && S.sort.startsWith('trend')) { S.sort = 'text'; $('#sort').value = 'text'; } views.browse = null; openTab('browse'); } };
  const body = $('#body');
  const syncFilters = () => body.classList.toggle('nofilters', !S.showFilters);
  const narrow = () => window.innerWidth <= 1150;
  $('#filterBtn').onclick = e => {
    e.stopPropagation();
    if (narrow()) body.classList.toggle('overlay');
    else { S.showFilters = !S.showFilters; save(); syncFilters(); sizeTiles(); }
  };
  // a click outside the floating filter panel closes it
  document.addEventListener('click', e => { if (body.classList.contains('overlay') && !e.target.closest('#filters')) body.classList.remove('overlay'); });
  document.addEventListener('click', e => {
    if (e.target.closest('[data-acc]')) { e.stopPropagation(); toggleAccounts(true); return; }
    if (!e.target.closest('#accounts, #me')) toggleAccounts(false);
  });
  syncFilters(); sizeTiles();
  renderFilters(); renderSort();
  await refreshInstalled(); setInterval(refreshInstalled, 30000);
  host.send('ready');
  try { me = await host.call('status'); } catch (e) { me = { loggedIn: false }; }
  renderMe();
  if (me.loggedIn) loadFollows();
  loadSubs(); setInterval(() => loadSubs(), 5 * 60e3); setInterval(loadSubsHead, 60e3);
  openTab(S.tab || 'timeline');
  // the timeline is the main view; load it in the background so the unread count shows even on other tabs
  if (me.loggedIn && S.tab !== 'timeline') { views.timeline = newView('timeline'); loadMore(views.timeline); }
})();
</script>
